name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2.1)'
        required: false
        default: 'v1.2.1'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Hyperbolic Explorer v1.2.1'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore 2>/dev/null || base64 -D debug.keystore.base64 > ~/.android/debug.keystore
            cp ~/.android/debug.keystore debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64."
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            cp ~/.android/debug.keystore debug.keystore
            echo "Successfully generated temporary debug.keystore."
          fi

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package & Prepare Release APKs
        run: |
          mkdir -p release_apks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/app-release.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/hyperbolic-explorer-v1.2.1.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/hyperbolic-explorer-release.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/app-debug.apk
          fi
          echo "Listing packaged release artifacts:"
          ls -la release_apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperbolic-explorer-v1.2.1-apk
          path: release_apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.2.1' }}
          RELEASE_TITLE: ${{ inputs.release_title || (startsWith(github.ref, 'refs/tags/v') && format('Hyperbolic Explorer {0}', github.ref_name)) || 'Hyperbolic Explorer v1.2.1 - Numerical Differentiation & Haptics Engine' }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🚀 Hyperbolic Explorer v1.2.1 Release

          An advanced interactive Android visualization, numerical differentiation suite, calculus engine for hyperbolic functions, and real-world catenary physics.

          ### ✨ What's New in v1.2.1
          - **📈 Numerical Differentiation & Derivative Curves**: Input any custom function $f(x)$ to compute and plot its numerical derivative $f'(x)$ and second derivative $f''(x)$ in real time using 5-point and 3-point central finite differences.
          - **📐 Dynamic Tangent & Normal Lines**: Interactive calculus scrubbers displaying tangent and normal lines, instantaneous slope angles ($\theta$), concavity, and radius of curvature.
          - **📳 Landmark Haptic Feedback**: Tactile physical vibration cues when the cursor or scrubber crosses significant mathematical landmarks such as the Y-intercept ($x=0$) and roots ($y=0$).
          - **📑 Modular Tabbed Sidebar**: Intuitive navigation grouping **Derivatives**, **Point Inspector**, **Numerical Equation Solver**, **Catenary Physics Simulator**, and **Calculus Reference**.
          - **🌉 Real-time Catenary Simulation**: Interactive cable sag, tension parameter ($a = T_0 / (\mu g)$), arc length calculation, and suspension bridge/power line presets.
          - **⚡ Performance Improvements**: Smooth 60fps canvas morphing transitions between hyperbolic functions.

          ### 📦 Download Assets
          - **`hyperbolic-explorer-v1.2.1.apk`**: Latest updated version (Recommended)
          - **`app-release.apk`**: Universal Android APK installer (Android 7.0+ / API 24+)
          - **`app-debug.apk`**: Debug build for developer testing
          EOF

          echo "Target Release Tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists (immutable). Attempting non-destructive upload or keeping existing assets..."
            gh release upload "$TAG_NAME" release_apks/* --clobber || echo "Release is immutable; existing release assets preserved."
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release_apks/* \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              --latest
            echo "Release $TAG_NAME successfully published!"
          fi


